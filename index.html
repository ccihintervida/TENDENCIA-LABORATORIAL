{% extends 'base.html' %}{% block content %}<div class="card"><h1>Pacientes</h1><form method="get" action="/"><label for="q">Pesquisar por nome ou prontuário</label><div class="inline"><input id="q" name="q" value="{{q}}" placeholder="Digite o nome ou prontuário"><button>Pesquisar</button></div></form></div><div class="card"><h2>Pacientes cadastrados</h2><div class="scroll"><table><tr><th>Nome</th><th>Prontuário</th><th>Abrir</th></tr>{% for p in patients %}<tr><td>{{p.nome}}</td><td>{{p.prontuario}}</td><td><a href="/pacientes/{{p.id}}">Ver histórico →</a></td></tr>{% else %}<tr><td colspan="3">Nenhum paciente encontrado.</td></tr>{% endfor %}</table></div></div><div class="card"><h2>Cadastrar paciente</h2><form method="post" action="/pacientes"><div class="grid"><div><label>Nome completo</label><input name="nome" required maxlength="180"></div><div><label>Número do prontuário</label><input name="prontuario" required maxlength="80"></div></div><p><button>Cadastrar paciente</button></p></form></div>{% endblock %}
